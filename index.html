<body data-page="today">
  <a class="skip-link" href="#main">跳到主要内容</a>

  <div class="app-shell">
    <aside class="sidebar">
      <a class="brand" href="index.html" aria-label="拾词首页">
        <span class="brand__mark" aria-hidden="true">
          <svg viewBox="0 0 48 48">
            <rect width="48" height="48" rx="15" fill="#e77756"></rect>
            <path d="M14 14.5c5.8 0 9.2 2.5 9.2 8V34c-2-2.7-4.8-4.1-9.2-4.1V14.5Z" fill="#f7f1e3"></path>
            <path d="M34 14.5c-5.8 0-9.2 2.5-9.2 8V34c2-2.7 4.8-4.1 9.2-4.1V14.5Z" fill="#f7f1e3" opacity=".85"></path>

          <strong>拾词</strong>

        </span>
      </a>

      <p class="nav-label">学习空间</p>
      <nav class="nav" aria-label="主导航">
        <a class="nav-item is-active" href="index.html" aria-current="page">
          <svg class="icon" aria-hidden="true"><use href="icons.svg#i-sun"></use></svg>
          <span>今日学习</span>
          <i class="nav-item__dot" aria-hidden="true"></i>
        </a>
        <a class="nav-item" href="library.html">
          <svg class="icon" aria-hidden="true"><use href="icons.svg#i-book"></use></svg>
          <span>我的词库</span>
          <i class="nav-item__dot" aria-hidden="true"></i>
        </a>
        <a class="nav-item" href="quiz.html">
          <svg class="icon" aria-hidden="true"><use href="icons.svg#i-spark"></use></svg>
          <span>词义挑战</span>
          <i class="nav-item__dot" aria-hidden="true"></i>
        </a>
        <a class="nav-item" href="stats.html">
          <svg class="icon" aria-hidden="true"><use href="icons.svg#i-chart"></use></svg>
          <span>学习统计</span>
          <i class="nav-item__dot" aria-hidden="true"></i>
        </a>
        <a class="nav-item" href="about.html">
          <svg class="icon" aria-hidden="true"><use href="icons.svg#i-lightbulb"></use></svg>
          <span>学习方法</span>
          <i class="nav-item__dot" aria-hidden="true"></i>
        </a>
      </nav>

      <div class="sidebar__spacer"></div>

      <div class="streak-card">
        <div class="streak-card__head">
          <span class="streak-card__flame"><svg class="icon" aria-hidden="true"><use href="icons.svg#i-flame"></use></svg></span>
          <span>连续学习</span>
        </div>
        <p class="streak-card__number"><strong data-streak>0</strong><span>天</span></p>
        <div class="streak-dots" id="sidebarWeekDots" aria-hidden="true"></div>
        <p class="streak-card__note" data-streak-note>今天开始，记录会被点亮。</p>
      </div>

      <p class="sidebar__foot">每天拾起一点，<br>语言自成风景。</p>
    </aside>

    <main class="main" id="main" tabindex="-1">
      <header class="topbar">
        <a class="mobile-brand" href="index.html" aria-label="拾词首页">
          <span class="mobile-brand__mark" aria-hidden="true">拾</span>
          <strong>拾词</strong>
        </a>
        <nav class="crumb" aria-label="面包屑">
          <span>学习空间</span>
          <i aria-hidden="true">/</i>
          <strong>今日学习</strong>
        </nav>
        <div class="topbar__right">
          <span class="streak-pill">
            <svg class="icon" aria-hidden="true"><use href="icons.svg#i-flame"></use></svg>
            <span>连续 <strong data-streak>0</strong> 天</span>
          </span>
          <span class="date-pill" id="topbarDate">今天 · 记录中</span>
          <span class="avatar" aria-hidden="true">拾</span>
        </div>
      </header>

      <div class="main__inner">
        <section class="today-hero" aria-labelledby="todayHeading">
          <div class="today-hero__copy">
            <p class="eyebrow">
              <span id="todayWeekday">TODAY</span>
              <i></i>
              <span id="todayDate">今天</span>
            </p>
            <h1 id="todayHeading"><span id="todayGreeting">你好</span>，<br><em>来拾几个词。</em></h1>
            <p class="hero-sub" id="todaySubtitle">少量、专注、重复。今天的目标是 12 个词，从第一个开始。</p>
            <div class="hero-tags" id="todayTags">
              <span class="hero-tag"><span class="dot"></span>已掌握 <b>0</b></span>
              <span class="hero-tag hero-tag--learning"><span class="dot"></span>待复习 <b>0</b></span>
              <span class="hero-tag hero-tag--streak"><span class="dot"></span>词库共 <b>240</b> 个</span>
            </div>
          </div>
          <div class="goal-disc" id="todayGoal" role="img" aria-label="今日目标 0 / 12">
            <span class="goal-disc__star" aria-hidden="true"></span>
            <svg class="goal-disc__ring" viewBox="0 0 206 206" aria-hidden="true">
              <circle class="ring-track" cx="103" cy="103" r="99"></circle>
              <circle class="ring-fill" cx="103" cy="103" r="99" stroke-dasharray="622" stroke-dashoffset="622"></circle>
            </svg>
            <span class="goal-disc__label">今日目标</span>
            <span class="goal-disc__number"><strong>0</strong><span>/ 12</span></span>
            <span class="goal-disc__foot">还差 12 个词</span>
          </div>
        </section>

        <div class="study-layout">
          <section id="studyCard" class="study-card" aria-label="今日单词">
            <div class="loading-state">
              <span class="loading-state__mark">拾</span>
              <p>正在整理今天的词…</p>
            </div>
          </section>
          <aside class="daily-rail" id="dailyRail" aria-label="今日学习辅助信息"></aside>
        </div>

        <footer class="site-footer">
          <p><strong>拾词</strong> · 每天拾起一点，语言自成风景。</p>
          <nav aria-label="辅助导航">
            <a href="about.html">学习方法</a>
            <a href="https://github.com/hyh061/shici">GitHub</a>
          </nav>
          <p class="site-footer__note">学习记录仅保存在当前浏览器。</p>
        </footer>
      </div>
    </main>
  </div>

  <dialog class="word-dialog" id="wordDialog" aria-labelledby="dialogTitle">
    <div class="dialog-shell">
      <button class="dialog-close" type="button" data-action="close-dialog" aria-label="关闭详情">
        <svg class="icon" aria-hidden="true"><use href="icons.svg#i-x"></use></svg>
      </button>
      <div id="dialogContent"></div>
    </div>
  </dialog>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <div class="sr-only" id="liveRegion" aria-live="polite"></div>
